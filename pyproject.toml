[project]
name = "apeiron"
version = "0.1.0"
description = "A PyTorch continual learning framework for real-time concept drift detection and model adaptation."
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch (>=2.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pandas-stubs (>=2.3.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "types-tqdm (>=4.66.0)",
    "wandb (>=0.22.0)",
    "mlflow (>=2.10.0)",
    "nvidia-ml-py (>=12.0.0)",
    "psutil (>=5.9.0)",
    "transformers (>=5.0.0)",
    "river (>=0.21.0,<0.24.0)",
    "evidently (>=0.4.0,<0.8.0)",
    "matplotlib (>=3.10.7,<4.0.0)"
]

[dependency-groups]
dev = [
    "mypy (>=1.18.2,<2.0.0)",
    "ruff (>=0.14.4,<0.15.0)",
    "black (>=25.11.0,<26.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "apeiron", from = "src" },
]

[tool.ruff]

[tool.ruff.lint]
# Add the codes you want to ignore to the 'ignore' list.
ignore = [
    "F811",  # Redefinition of unused name (often a false positive in PyTorch JIT overloading)
]

[tool.mypy]
# `apeiron` lives under src/, and the examples are packages rooted at the repo
# top level. Without both bases declared, mypy resolves `import apeiron` to the
# installed distribution -- which ships no py.typed -- and reports every
# first-party import as an untyped third-party one. mypy reads MYPYPATH, not
# PYTHONPATH, so the workflow's `PYTHONPATH: src` does not cover this.
mypy_path = "src"
explicit_package_bases = true
# The mirror of the F811 exemption in [tool.ruff.lint] above, for the same
# conditional redefinitions in the CIFAR example's model code.
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
module = "evidently.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

# The MATEY example's optional dependencies: matey itself, and the readers it
# uses for the SOLPS and XGC data formats. None of them ship type stubs, and
# none is installable on every target, so mypy cannot resolve them.
[[tool.mypy.overrides]]
module = ["matey.*", "adios2.*", "xgc_reader.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore:numpy\\.core is deprecated:DeprecationWarning",
    "ignore:Full backward hook is firing:UserWarning",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
