name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      WANDB_MODE: disabled

    steps:
    - uses: actions/checkout@v4

    # The torch/CUDA wheels are several GB, so don't push them through the
    # GitHub Actions cache on every run; download them fresh instead.
    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.13'
        enable-cache: false

    # --locked fails the build if uv.lock is out of date with pyproject.toml.
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: uv run ruff check

    - name: Check formatting with ruff
      run: uv run ruff format --check

    - name: Run mypy
      run: uv run mypy .

    - name: Run tests with coverage
      run: uv run pytest --cov=src --cov-report=term --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  examples:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      PYTHONPATH: src
      WANDB_MODE: disabled

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: '3.13'
        enable-cache: false

    - name: Install dependencies
      run: uv sync --locked

    - name: Run mnist
      run: uv run python -m src.main --config examples/mnist/mnist.toml

    - name: Run cifar
      run: uv run python -m src.main --config examples/cifar/cifar10_vit.toml
