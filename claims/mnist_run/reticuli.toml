# The claim: a reproducible APEIRON training run on MNIST.
#
# Every other claim in this ladder pins a layer's TESTS. This one pins a
# RESULT. The acceptance boundary is reference_trace.csv: the config in
# mnist-run.toml, driven through main.py over the pinned MNIST subset, must
# produce that metrics trace exactly on every value that is not a wall-clock
# reading. A reconstruction of APEIRON either reproduces this training result
# or it does not.
#
# REDUCED, in three ways, and check_mnist_run.py's docstring says why in
# full. Six stream windows instead of twenty, because the stream grows each
# window and every window re-evaluates all of it, so cost is quadratic in
# window count and twenty did not finish. Fifty CL iterations instead of six
# hundred, same reason. And the first 2,000 train and 2,000 validation
# examples of real MNIST rather than all 70,000 -- rewritten in the same
# idx-ubyte format and pinned here, because 64MB cannot be pinned and an
# external dataset would make the claim reproducible only where that dataset
# already sits.
#
# It is therefore a reproducible result, not a scientific one. The model
# reaches 100% on 2,000 images, which no paper would report. What the claim
# establishes is that this framework CAN produce a training trace
# reproducible to the last digit, and that a regrowth has to land on it.
#
# THE CLAIM CANNOT PASS UNSEEDED, which is the point. main.py is generated
# here, and two unseeded RNGs decide what the run does: torch (three loaders
# use shuffle=True with no generator, so batch order varies and about half
# the metrics move) and numpy (the monitor samples `detected=0` rows at 10%
# to hold log volume down, so the trace's SHAPE varies -- 1843, 1842 and 1846
# rows on three runs). Stripping both seed calls makes this gate fail on
# final accuracy, 87.5 against the pinned 100.0. The one-line upstream fix
# A41 asks for is not argued for in prose here; it is required to pass.

[claim]
name = "apeiron-mnist-run"
format = 4
requires = ["python3"]
gate_timeout = 900.0
environment = "requirements.lock"
inputs = [
    # the criteria, the pinned result, and the configuration that produces it
    "check_mnist_run.py",
    "mnist-run.toml",
    "reference_trace.csv",
    # data, pinned because the result is a function of these exact bytes
    "data/MNIST/raw/train-images-idx3-ubyte",
    "data/MNIST/raw/train-labels-idx1-ubyte",
    "data/MNIST/raw/t10k-images-idx3-ubyte",
    "data/MNIST/raw/t10k-labels-idx1-ubyte",
    "examples/mnist/mnist.pth",
    # the profiler's cost table: data, as in the entrypoints claim
    "apeiron/profilers/aten_flops_map.py",
]

