# The claim: APEIRON's three entry points, composed on the whole framework.
#
# Pinned: test_entry_points.py and test_cl_schedules.py, the repository's
# shared conftest.py (copied from tests/ at 63a877a), pytest.ini, and the
# full-stack lock. Generated: the three runners plus the example factory
# they import -- examples/utils.py dispatches lazily per dataset, so the
# room needs the factory but none of the example harnesses or torchvision.
# Everything under apeiron/ arrives from the nine component claims.
#
# These files live at the repository root rather than inside the package
# (`python -m src.main`), which is why the claim carries them at their own
# names instead of under apeiron/.

[claim]
name = "apeiron-entrypoints"
format = 4
requires = ["python3"]
gate_timeout = 900.0
environment = "requirements.lock"
inputs = [
    # the profiler's cost table: data, pinned here too so the room has it
    "apeiron/profilers/aten_flops_map.py",
    "test_schedule_contract.py",
    "test_entry_points.py",
    "test_cl_schedules.py",
    "conftest.py",
    "test_run_records.py",
    "test_logged_schema.py",
    "pytest.ini",
]

# --- supplied by the apeiron-config component --------------------------------
