[[step]]
kind = "produce"
output = "examples/utils.py"
class = "generated"
guidance = "get_example(cfg) -> BaseModelHarness: dispatches on cfg.data.name to MNIST_CNN ('mnist'), CIFAR_VISION ('cifar10') or IMAGENET_VISION ('imagenet'), importing each harness INSIDE its branch so a run never pays for datasets it does not use, and raising NotImplementedError naming the dataset otherwise."

[[step]]
kind = "produce"
output = "main.py"
class = "generated"
guidance = "the drift-driven entry point. main(argv) builds the config, configures the logging backend and the singleton logger BEFORE the harness is constructed (get_logger ignores its arguments once an instance exists, so a harness that logs from __init__ would otherwise pin the config), names the project from logging.experiment_name or 'basesim-framework', builds the harness through get_example, runs ContinuousMonitor, finishes the logger and returns 0."

[[step]]
kind = "produce"
output = "drift_only.py"
class = "generated"
guidance = "detection without adaptation, for measuring what a detector would have fired on. DriftOnlyMonitor mirrors ContinuousMonitor's loop -- per-batch evaluation, the same aggregation, the same profiling, the same logged field names -- but replaces _handle_drift with recording the event, constructs no trainer and never trains, so the model's weights are unchanged at the end. It resets the detector after each event when drift_detection.reset_after_learning is set. run_drift_only(cfg, modelHarness) returns a summary with detector, batches, stream_updates, drift_checks, drift_events, drift_windows and final_metrics; main(argv) prints it under '==== Drift-only summary ===='."

[[step]]
kind = "produce"
output = "cl_only.py"
class = "generated"
guidance = "adaptation on a schedule instead of on detected drift, for the accuracy-cost frontier. TriggerSchedule subclasses: NeverSchedule (the frozen lower bound), PeriodicSchedule(period) firing at the END of each period so period N fires floor(windows/N) times and refusing period < 1, RandomSchedule(seed, prob, budget, horizon) as the rate-matched null -- either Bernoulli(prob) per window or exactly budget windows sampled without replacement from [0, horizon), refusing a non-positive horizon, a budget exceeding it, or neither prob nor budget -- and FixedSchedule(trigger_at) for attribution replays. Each has a describe() string. make_schedule(args, cfg) builds one from the parsed flags, defaulting the horizon to drift_detection.max_stream_updates, deriving a period from a budget, letting --schedule-seed override cfg.seed for placement only, and refusing an unknown name. ScheduledCLRunner mirrors ContinuousMonitor's loop with the detector call replaced by the schedule, still aggregating and logging metrics at every decision point so a schedule run's metric trace is comparable to a detector run's, and checkpointing each trigger when the harness has checkpointing enabled. main(argv) parses its own flags with parse_known_args, passes the rest to build_config, and prints the summary under '==== Scheduled CL summary ===='."

[[step]]
kind = "gate"
output = "ENTRYPOINTS_OK"
class = "validated"
run = "PYTHONPATH=. python3 -m pytest -q -p no:cacheprovider test_entry_points.py test_cl_schedules.py test_run_records.py test_logged_schema.py test_schedule_contract.py && printf ok > ENTRYPOINTS_OK"
