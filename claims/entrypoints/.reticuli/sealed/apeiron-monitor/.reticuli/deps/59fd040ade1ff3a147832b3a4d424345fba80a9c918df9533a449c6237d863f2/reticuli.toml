# The claim: APEIRON's continual-learning trainer, composed on every layer
# beneath it.
#
# Pinned: test_continuous_trainer.py and the repository's shared conftest.py
# (copied from tests/ at 63a877a), pytest.ini, and the full-stack lock --
# the trainer reaches the logger, which imports wandb at module scope and
# mlflow lazily, so the room carries APEIRON's whole runtime. Generated:
# the trainer and its package export. Everything else arrives from the six
# component claims.

[claim]
name = "apeiron-trainer"
format = 4
requires = ["python3"]
gate_timeout = 900.0
environment = "requirements.lock"
inputs = [
    # the profiler's cost table: data, pinned here too so the room has it
    "apeiron/profilers/aten_flops_map.py",
    "test_continuous_trainer.py",
    "conftest.py",
    "pytest.ini",
]

# --- supplied by the apeiron-config component --------------------------------
[[step]]
kind = "produce"
output = "apeiron/config/__init__.py"
class = "generated"
from = "apeiron-config"
guidance = "supplied by the apeiron-config component"
[[step]]
kind = "produce"
output = "apeiron/config/configuration.py"
class = "generated"
from = "apeiron-config"
guidance = "supplied by the apeiron-config component"
# --- supplied by the apeiron-evaluation component ----------------------------
[[step]]
kind = "produce"
output = "apeiron/evaluation/__init__.py"
class = "generated"
from = "apeiron-evaluation"
guidance = "supplied by the apeiron-evaluation component"
[[step]]
kind = "produce"
output = "apeiron/evaluation/metrics.py"
class = "generated"
from = "apeiron-evaluation"
guidance = "supplied by the apeiron-evaluation component"
[[step]]
kind = "produce"
output = "apeiron/evaluation/evaluation.py"
class = "generated"
from = "apeiron-evaluation"
guidance = "supplied by the apeiron-evaluation component"
# --- supplied by the apeiron-model-harness component -------------------------
[[step]]
kind = "produce"
output = "apeiron/model/__init__.py"
class = "generated"
from = "apeiron-model-harness"
guidance = "supplied by the apeiron-model-harness component"
[[step]]
kind = "produce"
output = "apeiron/model/torch_model_harness.py"
class = "generated"
from = "apeiron-model-harness"
guidance = "supplied by the apeiron-model-harness component"
# --- supplied by the apeiron-updaters component ------------------------------
[[step]]
kind = "produce"
output = "apeiron/training/updater/__init__.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
[[step]]
kind = "produce"
output = "apeiron/training/updater/base.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
[[step]]
kind = "produce"
output = "apeiron/training/updater/no_updater.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
[[step]]
kind = "produce"
output = "apeiron/training/updater/ewc.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
[[step]]
kind = "produce"
output = "apeiron/training/updater/kfac.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
[[step]]
kind = "produce"
output = "apeiron/training/updater/jvp_reg.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
[[step]]
kind = "produce"
output = "apeiron/training/updater/create_updater.py"
class = "generated"
from = "apeiron-updaters"
guidance = "supplied by the apeiron-updaters component"
# --- supplied by the apeiron-logger component --------------------------------
[[step]]
kind = "produce"
