# --- this layer: regrowable, outside the root -------------------------

[[step]]
kind = "produce"
output = "apeiron/__init__.py"
class = "generated"
guidance = "the package's public surface: re-export Config, ModelCfg, DataCfg, TrainCfg, ContinualLearningCfg, DriftDetectionCfg, LoggingCfg and build_config from config.configuration; BaseModelHarness from model.torch_model_harness; ContinuousMonitor from driver.continuous_monitor; BaseDriftDetector, DriftSignal, LearningRegime, ADWINDetector, KSWINDetector, PageHinkleyDetector, ModelPerformanceDetector, EnsembleDetector and ModelEvalDetector from drift_detection; ContinuousTrainer from training; BaseUpdater from training.updater; Logger and get_logger from logger. Every name is also listed in __all__, and each must be the SAME object as its defining module's, not a copy."

[[step]]
kind = "produce"
output = "apeiron/driver/__init__.py"
class = "generated"
guidance = "re-export ContinuousMonitor from apeiron.driver.continuous_monitor"

[[step]]
kind = "produce"
output = "apeiron/driver/continuous_monitor.py"
class = "generated"
guidance = "regenerate ContinuousMonitor(cfg, modelHarness): the drift-monitoring loop. run() extends the stream, evaluates every batch into a metric buffer, and every drift_detection.detection_interval batches calls _check_drift, stopping once stream_update_count reaches max_stream_updates. _check_drift reduces the buffer to the monitored scalar by drift_detection.aggregation ('median', 'last', or the mean as the fallback for anything else), clears the buffer, pushes the scalar through the detector built by load_drift_detector, logs the drift row, and raises RuntimeError when the buffer is empty. On a detected signal _handle_drift counts the event, dispatches ContinuousTrainer.outer_cl_training_loop(drift_event_id=...), saves a checkpoint when the harness has checkpointing enabled, resets the detector when drift_detection.reset_after_learning is set, and resumes. The detector call is wrapped in profiler measurement after the warmup window; a harness exposing current_window_timerange has its span logged as data_time_start and data_time_end."

[[step]]
kind = "gate"
output = "MONITOR_OK"
class = "validated"
run = "PYTHONPATH=. python3 -m pytest -q -p no:cacheprovider test_continuous_monitor.py test_adaptation_cycle.py test_contracts_and_branches.py test_public_api.py test_logged_schema.py test_subclass_seams.py test_export_surface.py test_drift_row_schema.py test_warmup_logging.py && printf ok > MONITOR_OK"
