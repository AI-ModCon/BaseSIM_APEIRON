# The claim: APEIRON's monitoring driver -- the loop the whole framework
# exists to run -- composed on every layer beneath it.
#
# Pinned: test_continuous_monitor.py, test_adaptation_cycle.py and
# test_contracts_and_branches.py, the repository's shared conftest.py (all
# copied from tests/ at 63a877a), pytest.ini, and the full-stack lock.
# test_subclass_seams.py is ours: the surface drift_only.py and cl_only.py
# read off this class, which no file copied from tests/ asserts.
# Generated: the monitor and its package export; everything else arrives
# from the eight component claims.

[claim]
name = "apeiron-monitor"
format = 4
requires = ["python3"]
gate_timeout = 900.0
environment = "requirements.lock"
inputs = [
    "apeiron/profilers/aten_flops_map.py",
    "test_warmup_logging.py",
    "test_drift_row_schema.py",
    "test_export_surface.py",
    "test_continuous_monitor.py",
    "test_adaptation_cycle.py",
    "test_contracts_and_branches.py",
    "test_public_api.py",
    "conftest.py",
    "test_logged_schema.py",
    "test_subclass_seams.py",
    "pytest.ini",
]

