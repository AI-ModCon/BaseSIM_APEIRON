# slac-fel.toml  —  LCLS FEL continuous-learning experiment
seed = 42
device = "auto"
multi_gpu = false
verbosity = "DEBUG"

[model]
name = "fel"
# Set to "" to train from scratch, or point to a saved state_dict .pt file
pretrained_path = "examples/slac_fel/model/final_lcls_fel_model.pt"
max_ckpts = 20
ckpts_path = "output/slac-fel/"

[data]
name = "slac-fel"
path = "examples/slac_fel/data"
# Number of samples per time window (smaller = finer drift granularity)
batch_size = 5000

[train]
batch_size = 512
num_workers = 4
init_lr = 1e-5
max_iter = 6000
grad_accumulation_steps = 1


[continual_learning]
update_mode = "ewc_online"
mix_historic_data = true

# JVP regularization (used when update_mode = "jvp_reg")
jvp_rho_theta = 0.05
jvp_rho_x = 1.0
jvp_data_sign = 1.0

# EWC (used when update_mode = "ewc_online")
ewc_lambda = 1000.0
ewc_ema_decay = 0.95

# KFAC (used when update_mode = "kfac_online")
kfac_lambda = 1e-2
kfac_ema_decay = 0.95


[drift_detection]
detector_name = "EnsembleDetector"
ensemble_detectors = ["PageHinkleyDetector", "KSWINDetector"]
ensemble_voting = "any"

kswin_alpha = 0.05         
kswin_window_size = 20
kswin_stat_size = 10

ph_min_instances = 30
ph_delta = 0.3            
ph_threshold = 2.0       
ph_alpha = 0.9999

metric_index = 0
detection_interval = 2
aggregation = "mean"
reset_after_learning = false
max_stream_updates = 307


[logging]
backend = "wandb"
experiment_name = "slac-fel-cl"
#mlflow_tracking_uri = "https://ard-mlflow.slac.stanford.edu/"

[visualization]
input = "output/slac-fel.csv"

