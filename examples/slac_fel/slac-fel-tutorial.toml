# Focused SLAC-FEL drift-adaptation tutorial.
#
# Expected dataset:
#   data_730.pkl through data_743.pkl
#
# Provide its location at runtime:
#   --set data.path=/path/to/tutorial/data
#
# The subset contains one major regime transition at data_740.pkl.
# Page-Hinkley detects the transition and initiates one short adaptation.

seed = 42
device = "cpu"
multi_gpu = false
verbosity = "INFO"

[model]
name = "fel"
pretrained_path = "examples/slac_fel/model/final_lcls_fel_model.pt"
max_ckpts = 2
ckpts_path = "output/slac-fel/tutorial/checkpoints"

[data]
name = "slac-fel"
path = "data/slac-fel/tutorial"
batch_size = 5000

[train]
batch_size = 512
num_workers = 0
init_lr = 1e-5
max_iter = 200
grad_accumulation_steps = 1

[continual_learning]
update_mode = "ewc_online"
mix_historic_data = true
ewc_lambda = 1000.0
ewc_ema_decay = 0.95

[drift_detection]
detector_name = "PageHinkleyDetector"
detection_interval = 2
aggregation = "mean"
metric_index = 0
reset_after_learning = true
max_stream_updates = 13
ph_min_instances = 10
ph_delta = 0.3
ph_threshold = 2.0
ph_alpha = 0.9999

[logging]
backend = "none"
metrics_output_path = "output/slac-fel/tutorial/metrics.csv"
