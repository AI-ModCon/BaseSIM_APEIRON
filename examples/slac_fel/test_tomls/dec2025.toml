# December 2025 whole-month demo (seeded). Streams the 150 Dec-2025 windows
# (data_699..data_848, Dec 1 - Dec 16; beam stops mid-month) from the pretrained
# model with standard drift-triggered EWC continual learning.
# Symlink dir:
#   for n in $(seq 699 848); do ln -s \
#     /Users/smiskov/SLAC/LCLS_FEL_modeling/raw_data/proc_data/data_$n.pkl \
#     output/slac-fel/dec2025_data/data_$n.pkl; done
# Run:
#   poetry run python -m src.main --config examples/slac_fel/test_tomls/dec2025.toml
seed = 42
device = "cpu"
multi_gpu = false
verbosity = "DEBUG"

[model]
name = "fel"
pretrained_path = "examples/slac_fel/model/final_lcls_fel_model.pt"
max_ckpts = 20
ckpts_path = "output/slac-fel/dec2025"

[data]
name = "slac-fel"
path = "output/slac-fel/dec2025_data"
batch_size = 5000

[train]
batch_size = 512
num_workers = 0
init_lr = 1e-5
max_iter = 6000
grad_accumulation_steps = 1

[continual_learning]
update_mode = "ewc_online"
mix_historic_data = true
ewc_lambda = 1000.0
ewc_ema_decay = 0.95

[drift_detection]
detector_name = "EnsembleDetector"
ensemble_detectors = ["PageHinkleyDetector", "KSWINDetector"]
ensemble_voting = "any"
kswin_alpha = 0.05
kswin_window_size = 20
kswin_stat_size = 10
ph_min_instances = 30
ph_delta = 0.3
ph_threshold = 2.0
ph_alpha = 0.9999
metric_index = 0
detection_interval = 2
aggregation = "mean"
reset_after_learning = false
max_stream_updates = 150

[logging]
backend = "none"

[visualization]
input = "output/slac-fel/dec2025.csv"
