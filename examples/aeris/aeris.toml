[root]
# aeris.toml  —  AERIS continuous-learning
seed = 42
device = "auto"
multi_gpu = false
verbosity = "INFO:1"

[model]
name = "aeris_init.pt"
pretrained_path = "examples/aeris/model"
max_ckpts = 100
ckpts_path = "output/aeris/"

[data]
name = "aeris"
path = "examples/aeris/data/aeris_dataset.csv"
batch_size = 16

[train]
batch_size = 300
num_workers = 4
init_lr = 1e-3
max_iter = 100
grad_accumulation_steps = 1

[continual_learning]
update_mode = "ewc_online"
mix_historic_data = true

# JVP regularization (used when update_mode = "jvp_reg")
jvp_rho_theta = 0.05
jvp_rho_x = 1.0
jvp_data_sign = 1.0

# EWC (used when update_mode = "ewc_online")
ewc_lambda = 1000.0
ewc_ema_decay = 0.95

# KFAC (used when update_mode = "kfac_online")
kfac_lambda = 1e-2
kfac_ema_decay = 0.95

[drift_detection]
detector_name = "KSWINDetector"
detection_interval = 2
aggregation = "mean"
metric_index = 1
reset_after_learning = true
max_stream_updates = 84

# --- ADWINDetector ---
adwin_delta = 0.9
adwin_minor_threshold = 0.1
adwin_moderate_threshold = 0.6

# --- KSWINDetector ---
kswin_alpha = 0.05
kswin_window_size = 100
kswin_stat_size = 30

# --- PageHinkleyDetector ---
ph_min_instances = 30
ph_delta = 0.005
ph_threshold = 0.6
ph_alpha = 0.9999

[logging]
backend = "wandb"
experiment_name = "aeris-cl"
# mlflow_tracking_uri = "http://127.0.0.1:5000"
