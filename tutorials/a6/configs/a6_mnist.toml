# A6 base config: a complete drift-aware pipeline on MNIST, sized for a laptop CPU.
# Labs 1-3 all start from this file and change one thing at a time with --set.
# Run from the Apeiron repo root:
#   python -m src.main --config tutorials/a6/configs/a6_mnist.toml
seed = 1337
device = "cpu"          # "auto" picks CUDA / Apple MPS when available
verbosity = "INFO:1"     # INFO:1 also prints each update's before/after accuracy; "INFO" is quieter

[model]
name = "mnist-cnn"
pretrained_path = "examples/mnist/mnist.pth"   # deliberately under-trained starting model
max_ckpts = 0

[data]
name = "mnist"          # selects the bundled MNIST harness (examples/mnist/model.py)
path = ""
batch_size = 32         # stream batch: the model scores 32 images at a time

[train]
batch_size = 64
num_workers = 0         # 0 = no worker processes; most portable across OSes
init_lr = 0.001
max_iter = 100          # CL gradient steps per drift event (bundled example uses 600)
grad_accumulation_steps = 1

[continual_learning]
update_mode = "ewc_online"   # base | ewc_online | kfac_online | jvp_reg | none
mix_historic_data = true     # replay: half of every CL batch comes from past windows
ewc_lambda = 1000.0
ewc_ema_decay = 0.95

[drift_detection]
detector_name = "ADWINDetector"
detection_interval = 10      # check for drift every 10 stream batches
aggregation = "mean"         # detector sees the mean of those 10 batch scores
metric_index = 0             # 0 = accuracy, 1 = loss (order of eval_metrics in the harness)
reset_after_learning = true  # start the detector fresh after each adaptation
max_stream_updates = 6       # number of stream windows; each window adds a new distortion
adwin_delta = 0.002
adwin_minor_threshold = 0.3
adwin_moderate_threshold = 0.6

[logging]
backend = "none"             # "wandb" or "mlflow" also work; "none" needs no account
experiment_name = "a6-lab1"
metrics_output_path = "output/a6/lab1.csv"
