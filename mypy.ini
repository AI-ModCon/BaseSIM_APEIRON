# mypy.ini
[mypy]
python_version = 3.12
disable_error_code = no-redef
files = src
explicit_package_bases = True
mypy_path = src

[mypy-torchvision.*]
ignore_missing_imports = True
[mypy-torch.*]
ignore_missing_imports = True

[mypy-evidently.*]
ignore_missing_imports = True

# scipy ships no stubs and scipy-stubs is not a project dependency.
[mypy-scipy.*]
ignore_missing_imports = True

# The MATEY example's optional dependencies; none ships type stubs.
[mypy-matey.*]
ignore_missing_imports = True
[mypy-adios2.*]
ignore_missing_imports = True
[mypy-xgc_reader.*]
ignore_missing_imports = True
[mypy-netCDF4.*]
ignore_missing_imports = True

# A standalone diagnostic that reaches through torch's loosely-typed Module
# attributes into MATEY's embedding tables (`model.matey_model.space_bag[0]`).
# Narrowing every `Tensor | Module` and `Tensor | None` there would add asserts
# that document mypy rather than the checkpoint. It is a one-off tool, not part
# of the harness, and is exercised by running it.
[mypy-examples.matey.sweep_field_labels]
ignore_errors = True
