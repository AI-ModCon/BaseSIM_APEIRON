# mypy.ini
[mypy]
python_version = 3.12
disable_error_code = no-redef
files = src
explicit_package_bases = True
mypy_path = src

[mypy-torchvision.*]
ignore_missing_imports = True
[mypy-torch.*]
ignore_missing_imports = True

[mypy-evidently.*]
ignore_missing_imports = True

# The MATEY example's optional dependencies: matey itself, and the readers it
# uses for the SOLPS and XGC data formats. None of them ship type stubs.
[mypy-matey.*]
ignore_missing_imports = True
[mypy-adios2.*]
ignore_missing_imports = True
[mypy-xgc_reader.*]
ignore_missing_imports = True
