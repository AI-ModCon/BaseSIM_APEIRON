# GitLab CI/CD pipeline (migrated from .github/workflows)
#
# Mirrors the two former GitHub Actions workflows:
#   - build-test.yml  -> `build` + `examples` jobs (test stage)
#   - build-image.yml -> `docker-test` job (docker stage)

stages:
  - test
  - docker

variables:
  PYTHONPATH: src
  WANDB_MODE: disabled

# Lint + type check + tests with coverage.
# Runs on every push (equivalent to GitHub `on: [push]`).
build:
  stage: test
  image: python:3.13
  # We're doing this craziness because of limitations on the CI runners. They're
  # quite small and some of our dependencies like torch are kind of large. Poetry
  # install takes up a bit more space than delegating to pip.
  before_script:
    - pip install --no-cache-dir poetry poetry-plugin-export
    - poetry config virtualenvs.create false
    - poetry export -f requirements.txt -o requirements.txt --without-hashes --with dev
    - pip install --no-cache-dir -r requirements.txt && rm requirements.txt
  script:
    - poetry run ruff check
    - poetry run ruff format --check
    - poetry run mypy .
    - poetry run pytest --cov=src --cov-report=term --cov-report=xml
  # GitLab-native coverage: parse the total from pytest's terminal output and
  # publish the cobertura report so coverage shows on MRs.
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

# Run the bundled examples. In GitHub this was gated behind `workflow_dispatch`;
examples:
  stage: test
  image: python:3.13
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  before_script:
    - pip install --no-cache-dir poetry poetry-plugin-export
    - poetry config virtualenvs.create false
    - poetry export -f requirements.txt -o requirements.txt --without-hashes --with dev
    - pip install --no-cache-dir -r requirements.txt && rm requirements.txt
  script:
    - poetry run python -m src.main --config examples/mnist/mnist.toml
    - poetry run python -m src.main --config examples/cifar/cifar10_vit.toml

# Build the Docker image and run the test suite inside it.
docker-test:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t image -f dockerfiles/Dockerfile .
    - docker run image pytest
